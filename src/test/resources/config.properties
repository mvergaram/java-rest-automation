# Non-secret fallback defaults. Real Twilio credentials and PRESIGN_BASE_URL must always
# come from environment variables — see .env.example. MEDIA_MODE/VERBOSE_HTTP_LOGS can also
# be overridden via environment variables; the values below are only the fallback.
media.mode=REFERENCE_ONLY
poll.initial-delay-seconds=30
poll.timeout-seconds=120
poll.interval-seconds=5
