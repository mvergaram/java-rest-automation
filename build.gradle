plugins {
    id 'java'
}

group = 'com.twilio.automation'
version = '1.0.0-SNAPSHOT'

repositories {
    mavenCentral()
}

ext {
    groovyVersion = '2.5.23'
    jacksonVersion = '2.17.2'
}

// rest-assured 4.1.2 (2019) pulls in Groovy 2.5.x, which predates modern JDKs by several
// years. Forcing these versions mirrors the dependencyManagement overrides in pom.xml so
// both build tools resolve the same dependency graph (see AGENTS.md for the rationale).
configurations.all {
    resolutionStrategy {
        force "org.codehaus.groovy:groovy:${groovyVersion}",
              "org.codehaus.groovy:groovy-xml:${groovyVersion}",
              "org.codehaus.groovy:groovy-json:${groovyVersion}",
              "org.hamcrest:hamcrest:2.2"
    }
}

dependencies {
    testImplementation platform("com.fasterxml.jackson:jackson-bom:${jacksonVersion}")

    testImplementation 'io.rest-assured:rest-assured:4.1.2'
    testImplementation 'io.rest-assured:json-schema-validator:4.1.2'
    testImplementation 'org.junit.jupiter:junit-jupiter:5.10.3'
    testImplementation 'com.fasterxml.jackson.core:jackson-databind'
    testImplementation 'org.awaitility:awaitility:4.2.1'
    testImplementation 'org.assertj:assertj-core:3.26.3'
    testImplementation 'org.hibernate.validator:hibernate-validator:8.0.1.Final'
    testImplementation 'org.glassfish:jakarta.el:4.0.2'

    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

// Compiles against release 21 using whichever JDK runs Gradle (no toolchain
// auto-provisioning / download needed) — same compatibility strategy as pom.xml.
tasks.withType(JavaCompile).configureEach {
    options.release = 21
}

test {
    useJUnitPlatform()
    // Loosens JDK 21+ module reflection so Groovy/Jackson (bundled by rest-assured 4.1.x) can operate.
    jvmArgs += [
        '--add-opens', 'java.base/java.lang=ALL-UNNAMED',
        '--add-opens', 'java.base/java.util=ALL-UNNAMED',
        '--add-opens', 'java.base/java.lang.reflect=ALL-UNNAMED',
        '--add-opens', 'java.base/java.text=ALL-UNNAMED'
    ]
}
